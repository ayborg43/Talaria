name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: build (static, no cgo)
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/tal
      - name: test
        shell: bash
        run: |
          # On failure, say which tests failed in an annotation, where it can be read without downloading logs.
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee test.log || {
            status=$?
            summary=$(grep -B1 -A14 -E '^(--- FAIL|panic:|FAIL[[:space:]])' test.log | head -120 | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=go test failed on ${{ matrix.os }}::${summary}"
            exit $status
          }

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker build --build-arg VERSION=ci -t talaria:ci .
      - name: it starts, and says which build it is
        run: docker run --rm -v ci-data:/data talaria:ci version | grep -q "talaria ci"
      - name: it refuses to start on a state folder it cannot write
        run: |
          mkdir -p "$RUNNER_TEMP/rootowned"
          if docker run --rm -v "$RUNNER_TEMP/rootowned:/data" --entrypoint talaria-entrypoint talaria:ci version; then
            echo "should have refused"; exit 1
          fi
      - name: the compose file is valid, and insists on a provider
        run: |
          TALARIA_PROVIDER=deepseek docker compose config -q
          if docker compose config -q 2>/dev/null; then echo "should have insisted"; exit 1; fi
